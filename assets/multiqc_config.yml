report_comment: >
  This report has been generated by the <a href="https://github.com/break-through-cancer/staple" target="_blank">STAPLE</a>
  analysis pipeline.
report_section_order:
  "btc-spatial-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "btc-spatial-summary":
    order: -1002
custom_data:
  samplesheet:
    plot_type: 'table'
    section_name: 'Sample Sheet'
    description: 'The sample sheet provided as input to the pipeline. Sample sheet contains sample name, paths to the input data files and associated metadata.'
  atlas:
    plot_type: 'table'
    section_name: 'Atlas Summary'
    description: 'Summary of the cells and genes in the atlas. Atlas is used as a reference for deconvolution and cell type assignment.'
  atlas_ct:
    parent: 'atlas'
    plot_type: 'table'
    section_name: 'Atlas Cell Types'
    description: 'Summary of the cell types in the atlas. Provides an overview of the diversity and abundance of cell types used as reference in deconvolution.'
  adata:
    plot_type: 'table'
    section_name: 'Input Summary'
    description: 'Summary of the AnnData object right after it was read.'
  deconvolved:
    plot_type: 'table'
    section_name: 'Output Summary'
    description: 'Summary of the AnnData object after deconvolution / cell typing.'
  deconvolved_ct:
    parent: 'deconvolved'
    plot_type: 'table'
    section_name: 'Output Cell Types'
    description: 'Assigned cell types based on deconvolution / cell typing results. Unassigned counts appear in a column without name.'
  deconvolved_probs:
    parent: 'deconvolved'
    plot_type: 'table'
    section_name: 'Cell Type Probabilities'
    description: 'Average max cell type probabilities (fractions) used to assign the cell types. Greater values indicate more homogenous cell type assignments.'


sp:
  samplesheet:
    fn: 'samplesheet.valid.csv'
  atlas:
    fn: 'atlas_input_report.csv'
  adata:
    fn: 'adata_input_report.csv'
  deconvolved:
    fn: 'adata_output_report.csv'
  atlas_ct:
    fn: 'atlas_counts_report.csv'
  deconvolved_ct:
    fn: 'adata_counts_report.csv'
  deconvolved_probs:
    fn: 'cell_probs_report.csv'


ignore_images: false
export_plots: false

ai_summary_full: true
ai_prompt_full: |
  You are an expert bioinformatician. You are given a report generated by a spatial
  transcriptomics workflow. The report spans outputs of a number of bioinformatics
  tools and include quality control metrics, as well as actual aggregated analysis
  results. The report includes the samplesheet table that may contain important clinical
  metadata. Different report sections may have different structures and different
  biological meaning and contain a short descriptor of the section's structure and
  meaning. Your task is to analyse the data and give a concise summary.

  Evidence and interpretation rules:
  - Tie every claim to numeric evidence. Do not infer causality; describe associations
  only.
  - State a between-group difference (for any sample-metadata grouping — e.g. response,
  timepoint, region) ONLY if it is consistent across at least 2 samples per group, OR
  both the mean and the median support the same direction OR the table description states
  explicitly that a statistically significant effect is observed. Otherwise state that no
  consistent difference is detected.
  - When you say a group is higher or lower, check that the direction matches the numbers
  (e.g. do not call the smaller mean "higher").
  - Do not generalize a pattern driven by a single sample. If one sample drives a group's
  mean (an outlier), say so explicitly and treat that group-level claim as weak.
  - Assess within-group variability as low / moderate / high. If variability is high or
  the trend is inconsistent, prefer a conservative interpretation or report no clear
  difference.
  - Briefly note relevant limitations where they affect a conclusion (e.g. small sample
  size per group, high within-group variability, outlier influence) instead of implying
  certainty.
  - If citing someone else's work or data, provide a proper reference (prefer pubmed)
  and context for its relevance.

  Style and register (apply throughout):
  - Write in the neutral, descriptive register of a peer-reviewed research paper.
  - Report what the data shows; do not editorialize, rate, or pass judgement on it.
  - Remove judgemental and evaluative language. Do NOT use words such as: striking,
  remarkable, overwhelming, dominant(ly), extreme, dramatic, impressive, crucial,
  notable(ly), interesting, surprising, concerning, alarming, poor, excellent, good,
  bad, or superlatives; and do not use exclamations.
  - Lead with the data and tie every statement to specific values. Use hedged, precise
  verbs for any inference: "suggests", "is consistent with", "indicates", "may",
  "potentially". Prefer "associated with" over causal claims ("causes", "drives").
  - Report negative or null results plainly (e.g. "no differential signal was detected").
  - Present per-sample numbers in compact markdown tables rather than long inline lists.
  - When presenting summaries, check that all relevant samples are included.
  - Use plain formatting only: markdown headers, bold, and tables. Do NOT use LaTeX math
  ($...$, \\text{}, \\mathbf{}) or emoji.
  - Be concise: do not restate the section name or descriptor, and do not repeat the same
  adjective across sentences.
  - If a label or abbreviation's meaning is not provided, and it is not a commonly known 
  acronym, use it verbatim; do not infer or expand what it stands for.
